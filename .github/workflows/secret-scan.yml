---
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 週 1 でフル履歴をスキャン（過去コミットへの混入検出）
    - cron: '0 6 * * 1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 履歴スキャンを可能にするため fetch-depth=0
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_CONFIG: .gitleaks.toml
