[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    # 0.116 以降で依存性注入の挙動が変わり既存テストが 422 を返すため一旦上限を切る。
    "fastapi>=0.115.12,<0.116.0",
    "langchain>=0.3.23",
    "langchain-community>=0.3.21",
    "langchain-openai>=0.3.12",
    "langchain-text-splitters>=0.3.8",
    "mypy>=1.15.0,<2.0.0",
    "pydantic>=2.11.2,<2.12.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "unstructured-client>=0.32.1,<0.33.0",
    "unstructured>=0.17.2,<0.18.0",
    "pypandoc>=1.15,<2.0",
    "langchain-weaviate>=0.0.4,<0.0.5",
    "weaviate-client>=4.12.0,<5.0.0",
    # 2.0.44 以降で Result の型定義が変わり Result[Any].rowcount が見えなくなるため一旦上限を切る。
    "sqlalchemy>=2.0.40,<2.0.44",
    "psycopg2>=2.9.10,<3.0.0",
    "google-cloud-storage>=3.1.0,<4.0.0",
    "pyhumps>=3.8.0,<4.0.0",
    "google-cloud-texttospeech>=2.27.0,<3.0.0",
    "google-generativeai>=0.8.5,<0.9.0",
    "pydub>=0.25.1,<0.26.0",
    "ebooklib>=0.19,<0.20",
    "audioop-lts>=0.2.1,<0.3.0",
    # H-1: レート制限
    "slowapi>=0.1.9,<0.2.0",
    # CR-1: Supabase JWT 検証
    "PyJWT>=2.9.0,<3.0.0",
    # CR-6: EPUB XML パース堅牢化
    "defusedxml>=0.7.1,<0.8.0",
    "lxml>=5.3.0,<6.0.0",
    # M-15: スキーマ管理を Alembic に移行
    "alembic>=1.13.2,<2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1,<5.0.0",
    # Tests: 認可マトリクス検証
    "pytest>=8.3.3,<9.0.0",
    "httpx>=0.27.2,<0.28.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[tool.mypy]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true


[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # 外部ライブラリ由来の deprecation 警告を一時的に許容（自前コードの警告は捕捉する）
    "ignore::DeprecationWarning:google.protobuf.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning:starlette.*",
    "error::UserWarning:src.*",
]
markers = [
    "integration: requires live external services (DB / Weaviate / GCS)",
    "slow: long-running tests",
]
