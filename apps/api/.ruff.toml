# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "tmp",
  "protobuf",
]

# Same as Black.
line-length = 150
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[lint]
select = [
  "ANN",    # flake8-annotations
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "C",      # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "INP",    # flake8-no-pep420
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "T",      # Type Checking
  "TC",     # flake8-type-checking
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  "RUF100", # unused-noqa
]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic mthod
  "D106",
  "D107",
  "D203",
  "D205", # Conflicts with multiline comments on methods
  "D211",
  "D213",
  "E711",
  "SLF001",
  "ANN201",
  "B904",
  "D401",
  "D400",
  "D415"
  # "D400",
  # "D407",
  # "D415",
  # "D417",
  # "E402",
  # "E501",
  # "E721",
  # "E722",
  # "F722",
  # "N811",
  # "PIE794",
  # "PT011",
  # "PT012",
  # "RET505",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

flake8-bugbear.extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Security",
  "fastapi.Query",
  "fastapi.Cookie",
  "fastapi.security.HTTPBearer",
  "fastapi.security.OAuth2AuthorizationCodeBearer",
]

pep8-naming.classmethod-decorators = [
  "pydantic.validator",
  "sqlalchemy.ext.declarative.declared_attr",
]

# テストコードでは pytest フィクスチャや fake 実装の都合で型注釈の付与負荷が高く、
# また `pytest.raises(ValueError)` のような粒度の検証も妥当なため、
# テスト固有のノイズ系ルールは抑制する。alembic/env.py は Alembic が直接実行する
# スクリプトでありパッケージ化しないため INP001 を除外。
[lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN001",  # フィクスチャ引数 (monkeypatch / tmp_path 等) の型注釈
  "ANN202",  # テスト内ヘルパー / fake のプライベート関数戻り値型
  "ANN204",  # __aexit__ 等の特殊メソッド戻り値型 (fake context manager)
  "ANN401",  # テスト用 fake で **kwargs: Any を許容
  "PT011",   # pytest.raises(ValueError) 系の許容
  "PT012",   # pytest.raises ブロック内に複数文があるテスト
  "PT018",   # 複合 assert
  "B017",    # pytest.raises(Exception) を許容 (汎用例外検証)
  "SIM117",  # ネスト with (テスト見やすさ優先)
  "C901",    # テスト関数の複雑度
]
"alembic/env.py" = ["INP001"]  # Alembic が直接実行する設定スクリプト

# Enable stricter type checks (Ruff + MyPy integration)
[lint.flake8-type-checking]
strict = true

# C901 の上限を緩める。本プロジェクトのバリデーション系 (assert_production_ready /
# assert_epub_is_safe / _sanitize_metadata 等) や ASGI ミドルウェアの __call__ は
# 分岐が本質的に多く、無理に分割しても可読性が下がるため 15 まで許容する。
[lint.mccabe]
max-complexity = 15

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
